name: Catalog check

# Compares every game PadMint offers with what its latest release publishes, so a game
# release that adds or drops a download, target or build computer fails here instead of
# confusing players.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'catalog/**'
      - 'padmint/**'
      - 'scripts/audit-catalog.py'
      - 'tests/test_catalog_routes.py'
      - '.github/workflows/catalog-check.yml'

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check catalog route validation
        run: python -B -m unittest discover -s tests -p test_catalog_routes.py -v
      - name: Audit the catalog against each game's latest release
        # Once more after ten minutes, so a GitHub outage (8 November) isn't reported as a catalog problem.
        run: |
          PADMINT_HOME="$(mktemp -d)" python -B scripts/audit-catalog.py --json > catalog-audit.json || {
            sleep 600
            PADMINT_HOME="$(mktemp -d)" python -B scripts/audit-catalog.py --json > catalog-audit.json
          }
      - name: Keep the release and host matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: catalog-release-host-matrix
          path: catalog-audit.json
          retention-days: 14
          if-no-files-found: ignore
      # A failing daily check nobody sees protects nobody: keep one open issue for it.
      - name: Open or update the issue when the daily check fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Catalog check is failing"
          body="The daily catalog check failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Each problem it lists means PadMint offers players something different from what a game's latest release builds. Fix the catalog (and release PadMint) or the game's release, then close this issue."
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
