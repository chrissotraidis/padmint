name: Build a game for iPhone and iPad
# For players without a Mac with Apple Silicon. Use a public fork for the listed games
# except DarkPad, which requires a private repository and its Actions allowance. Open
# Actions, choose this workflow, pick a game and press Run workflow. GitHub makes your
# copy from the game's latest release, the same way PadMint does on a Mac. These games
# take your own game file inside the app after installing, so nothing of yours is
# uploaded. The IPA stays with your run for one day: download it, install it with
# Sideloadly and add your game in the app. README: "No Mac? Build on GitHub's Mac".
# On a pull request that changes this route, and every Monday in PadMint's own repository,
# every listed game is built on a clean Mac and nothing is kept: a game whose setup
# commands or recipe stopped working on a fresh Mac fails here before players find it.
on:
  workflow_dispatch:
    inputs:
      game:
        description: Game
        required: true
        type: choice
        options:
          - ballpad
          - barrelpad
          - bellpad
          - brawlerpad
          - ctrpad
          - darkpad
          - f0x
          - galaxypad
          - harkinianpad
          - maskpad
          - openrct2touch
          - paperpad
          - spaghettipad
          - starshippad
          - tribespad
          - utp
  pull_request:
    paths:
      - .github/workflows/build-for-iphone.yml
      - scripts/github-build.py
      - 'catalog/**'
      - 'padmint/**'
      - 'tests/test_github_build.py'
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  select-games:
    if: github.event_name != 'schedule' || github.repository == 'chrissotraidis/padmint'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.games.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: games
        env:
          GAME: ${{ github.event_name == 'workflow_dispatch' && inputs.game || '' }}
        run: |
          matrix=$(python3 scripts/github-build.py --matrix "$GAME")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
  build:
    needs: select-games
    runs-on: macos-15
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-games.outputs.matrix) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      GAME: ${{ matrix.game }}
      PADMINT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Make your copy on a fresh Mac
        run: |
          xcodebuild -version
          df -h "$RUNNER_TEMP"
          PADMINT_HOME="$RUNNER_TEMP/padmint" /usr/bin/python3 scripts/github-build.py "$GAME" --out "$RUNNER_TEMP/out"
      - name: Checksums
        working-directory: ${{ runner.temp }}/out
        run: |
          ls -la
          shasum -a 256 ./*.ipa | tee SHA256SUMS
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.game }}-iphone-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/out/*.ipa
            ${{ runner.temp }}/out/SHA256SUMS
          retention-days: 1
          if-no-files-found: error
