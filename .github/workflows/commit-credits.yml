name: Commit credits

# Claude or another AI tool must never show up in the Contributors list. GitHub counts every
# commit author and every Co-Authored-By line, so a commit that names an AI tool fails here,
# on pull requests and on pushes to main (see AGENTS.md).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-ai-coauthors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI authors or co-author lines in the commits or PR
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          ai='(claude|anthropic|copilot|codex|openai|gemini|cursor)'
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            range="$HEAD"
          else
            range="$BASE..$HEAD"
          fi
          trailers=$( { git log --format=%B "$range"; printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY"; } \
            | grep -iE "^(co-authored-by:.*$ai|.*generated with \[?$ai)" || true)
          people=$(git log --format='%h author %an <%ae>, committer %cn <%ce>' "$range" \
            | grep -iE "(author|committer) [^,]*$ai" || true)
          if [ -n "$trailers$people" ]; then
            printf '%s\n' "$trailers" "$people" | sed '/^$/d'
            echo "::error::An AI tool is credited above. Reword or squash the commits (and set your own name as author). PadMint lists only people as contributors."
            exit 1
          fi
